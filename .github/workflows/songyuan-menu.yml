name: songyuan UniXNU menu image
on:
  workflow_dispatch:
    inputs:
      uefi_run_id:
        description: Successful songyuan-uefi run with an unexpired songyuan-uefi artifact
        default: '43037599524'
        required: true
  push:
    paths: ['.github/workflows/songyuan-menu.yml']
permissions:
  contents: read
  actions: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NiandeNian/songyuan-device
          ref: 3c1917466e6f0fcaf64baade9f3aef3f6f820af1
          path: device
      - uses: actions/checkout@v4
        with:
          repository: NiandeNian/songyuan-uefi
          ref: eeeac0330b022e1b6efa5843e9eb1ab4809811c7
          path: uefi-port
      - name: Host dependencies
        timeout-minutes: 8
        run: |
          # The HTTPS resolver once returned a transient failure for security.
          for attempt in 1 2 3; do
            if sudo python3 uefi-port/.github/scripts/apt_dns_fallback.py; then break; fi
            test "$attempt" -lt 3
          done
          for mirror in /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
            if [ -f "$mirror" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://|https://|g' "$mirror"
            fi
          done
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y clang lld llvm device-tree-compiler
      - uses: actions/download-artifact@v4
        with:
          name: songyuan-uefi
          repository: NiandeNian/songyuan-uefi
          run-id: ${{ inputs.uefi_run_id || '43037599524' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware
      - name: Fetch BootShim and boot image tool
        run: |
          git init Mu-Silicium
          git -C Mu-Silicium fetch --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git 46e4ac0800862fb3ee6da09f0028fbef4e767648
          git -C Mu-Silicium checkout FETCH_HEAD
          cp uefi-port/Resources/Configs/songyuan.toml Mu-Silicium/Resources/Configs/songyuan.toml
          cp -r uefi-port/BootShim/. Mu-Silicium/BootShim/
      - name: Pack and verify the UniXNU menu image
        run: |
          fd=$(find firmware -name SILICIUM_UEFI.fd -type f)
          test -f "$fd"
          ./unixnu bootimg -D device --uefi Mu-Silicium --fd "$fd" --dtb device/inputs/canoe.dtb --ramdisk none
          echo 'UniXNU menu and DarwinBoot firmware image; no OS payload is included. Intended for fastboot boot. Physical boot and iOS 27 support are unverified.' > out/songyuan/boot/BUILD-SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: songyuan-unixnu-menu
          path: out/songyuan/boot/**
          if-no-files-found: error
          retention-days: 14
